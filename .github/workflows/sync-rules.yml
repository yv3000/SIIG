name: Sync Rules from siig-rules

on:
  schedule:
    - cron: '0 2 * * 1' # Every Monday at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SIIG
        uses: actions/checkout@v7

      - name: Clone siig-rules
        run: git clone --depth 1 https://github.com/yv3000/siig-rules.git /tmp/siig-rules

      - name: Copy rules into SIIG
        run: cp /tmp/siig-rules/db/*.json rules/db/

      # The embedded DB ships inside every binary, so a sync is reviewed like
      # any other change: branch + pull request, never a direct push or tag.
      - name: Open a pull request if rules changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- rules/db; then
            echo "siig-rules is already up to date. Nothing to open."
            exit 0
          fi

          count=$(git diff --name-only -- rules/db | wc -l | tr -d ' ')
          branch="bot/sync-rules-$(date -u +%Y%m%d)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add rules/db
          git commit -m "fix(rules): sync ${count} stack rule file(s) from siig-rules"
          git push -u origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(rules): sync ${count} rule file(s) from siig-rules" \
            --body "Automated weekly sync from [siig-rules](https://github.com/yv3000/siig-rules).

          ${count} file(s) under \`rules/db/\` changed. CI must pass before merge — the embedded DB is compiled into every release binary."
